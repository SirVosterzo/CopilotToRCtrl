name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path CopilotToRCtrl.exe, install.ps1, uninstall.ps1, README.md, LICENSE `
                           -DestinationPath dist/CopilotToRCtrl.zip
          $exe = (Get-FileHash CopilotToRCtrl.exe -Algorithm SHA256).Hash
          $zip = (Get-FileHash dist/CopilotToRCtrl.zip -Algorithm SHA256).Hash
          "CopilotToRCtrl.exe  SHA256: $exe`nCopilotToRCtrl.zip  SHA256: $zip" | Out-File dist/SHA256.txt -Encoding utf8
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CopilotToRCtrl
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fence = '```'
          @("Built by GitHub Actions from commit ${{ github.sha }}.", '', $fence, (Get-Content dist/SHA256.txt), $fence) |
            Out-File dist/notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" dist/CopilotToRCtrl.zip --title "${{ github.ref_name }}" --notes-file dist/notes.md
