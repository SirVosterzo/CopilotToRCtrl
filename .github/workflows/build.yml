name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # create the release
  actions: read   # let SignPath fetch the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Releases get signed once the SIGNPATH_API_TOKEN secret exists; until then they ship unsigned.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Check tag matches version
        id: version
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $v = (Get-Item CopilotToRCtrl.exe).VersionInfo.ProductVersion
          if ("v$v" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} doesn't match the exe version $v (CopilotToRCtrl.Version in CopilotToRCtrl.cs)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned exe for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CopilotToRCtrl-unsigned
          path: CopilotToRCtrl.exe
          if-no-files-found: error

      # Waits while the request is approved by hand in SignPath (release signing needs that).
      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'CopilotToRCtrl' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/CopilotToRCtrl.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status) - $($sig.StatusMessage)" }
          Write-Host "Signed by $($sig.SignerCertificate.Subject)"
          Copy-Item signed/CopilotToRCtrl.exe CopilotToRCtrl.exe -Force

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item CopilotToRCtrl.exe dist/
          $exe = (Get-FileHash dist/CopilotToRCtrl.exe -Algorithm SHA256).Hash
          "CopilotToRCtrl.exe  SHA256: $exe" | Out-File dist/SHA256.txt -Encoding utf8
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: CopilotToRCtrl
          path: dist/

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fence = '```'
          $signing = if ($env:SIGN -eq 'true') {
            'Signed through SignPath. See the [code signing policy](${{ github.server_url }}/${{ github.repository }}#code-signing-policy).'
          } else { 'Not code-signed.' }
          @("Built by GitHub Actions from commit ${{ github.sha }}. $signing", '', $fence, (Get-Content dist/SHA256.txt), $fence) |
            Out-File dist/notes.md -Encoding utf8
          gh release create "${{ github.ref_name }}" dist/CopilotToRCtrl.exe --title "${{ github.ref_name }}" --notes-file dist/notes.md
